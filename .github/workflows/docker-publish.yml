name: Docker Build and Publish

on:
  push:
    tags:
      - '*'

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tasktracker-api:${{ steps.tag.outputs.VERSION }} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tasktracker-api:latest .

      - name: Push version tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tasktracker-api:${{ steps.tag.outputs.VERSION }}

      - name: Push latest tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tasktracker-api:latest